<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>

    <h2>Lista</h2>
    
    <hr>
    <p>Lista organizada:</p>

    <ol type="1" start="1"> <!-- pode passar o parametro type para escolher o marcador, e o start é para dizer de onde é para começar -->

        

        <li>
            pegue os ovos e coloque na batedeira
        </li>
        <li>
            bata os ovos por 5 minutos
        </li>
        
        <li>
            adicione o açúcar e bata por mais 5 minutos
        </li>
        <li>
            adicione a farinha e misture
        </li>
    </ol>


    <p>Lista desordenada:</p>
    <ul type="circle"> <!-- pode passar o parametro type para escolher o marcador -->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3
            <ul> <!-- lista dentro de outra lista -->
                <li>Subitem 3.1</li>
                <li>Subitem 3.2</li>
            </ul>
        </li>
    </ul>

    <a href="index.html">Voltar para o índice</a>
</body>
</html>
