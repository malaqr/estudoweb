<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="" method="get">
            <fieldset>
            
                <!-- DADOS PESSOAIS -->
            <legend>Dados Pessoais</legend> 
            <!-- legenda para o fieldset, para acessibilidade -->
            <label for="name">Nome</label>
            <input id="name" type="text" name="name" required>
            <br>
            <label for="age">Idade</label>
            <input id="age" type="number" name="age" required min="12" max="100">
            <br>
            <label for ="birthday">Data de Nascimento</label>
            <input id="birthday" type="date" name="birthday">
            <br>
            <label for ="email">Email</label>
            <input id="email" type="email" name="email" required>
            <br>
            <label for="telephone">Telefone</label>
            <input id="telephone" type="tel" name="telephone" pattern="[0-9]{11}" placeholder="DDD + número">
            <br>
            <label for="userImage">Upload de foto</label>
            <input id="userImage" type="file" name="userImage" accept="image/*">
            <br>
          
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>

                <input id="feminino" type="radio" name="userGender" value="Feminino">
                <label for="feminino">Feminino</label>

                <input id="masculino" type="radio" name="userGender" value="Masculino">
                <label for="masculino">Masculino</label>

                <input id="naoInformar" type="radio" name="userGender" value="Prefiro não dizer">
                <label for="naoInformar">Prefiro não dizer</label>

                <br>

                <label for="maritalStatus">Estado Civil</label>
                <select id="maritalStatus" name="maritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="solteiro">Solteiro(a)</option>
                    <option value="casado">Casado(a)</option>
                    <option value="divorciado">Divorciado(a)</option>
                    <option value="viuvo">Viúvo(a)</option>
                </select>

                <label for="state">Estado</label>
                <select id="state" name="state">
                <option value="notInformed">Selecione...</option>
                <option value="acre">Acre</option>
                <option value="alagoas">Alagoas</option>
                <option value="amapa">Amapá</option>
                <option value="amazonas">Amazonas</option>
                <option value="bahia">Bahia</option>
                <option value="ceara">Ceará</option>
                <option value="distritoFederal">Distrito Federal</option>
                <option value="espiritoSanto">Espirito Santo</option>
                <option value="goias">Goiás</option>
                <option value="maranhao">Maranhão</option>
                <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                <option value="matoGrosso">Mato Grosso</option>
                <option value="minasGerais">Minas Gerais</option>
                <option value="para">Pará</option>
                <option value="paraiba">Paraíba</option>
                <option value="parana">Paraná</option>
                <option value="pernambuco">Pernambuco</option>
                <option value="piaui">Piauí</option>
                <option value="rioDeJaneiro">Rio de Janeiro</option>
                <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                <option value="rondonia">Rondônia</option>
                <option value="roraima">Roraima</option>
                <option value="santaCatarina">Santa Catarina</option>
                <option value="saoPaulo">São Paulo</option>
                <option value="sergipe">Sergipe</option>
                <option value="tocantins">Tocantins</option>
                </select>
                <br>

                <label for="city">Cidade</label>
                <input id="city" type="text" name="city">

                <br>
                <button type="submit">Enviar</button>
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais:</p>
                <input id="instagram" type="checkbox" name="socialMedia" value="Instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="socialMedia" value="Facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="twitter" type="checkbox" name="socialMedia" value="Twitter">
                <label for="twitter">Twitter</label>
                <br>
                <input id="linkedin" type="checkbox" name="socialMedia" value="LinkedIn">
                <label for="linkedin">LinkedIn</label>
            </fieldset>
            

        </form>

    </section>  


    
</body>
</html>
