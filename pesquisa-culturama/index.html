<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="" method="get">
            <fieldset>
            
                <!-- DADOS PESSOAIS -->
            <legend>Dados Pessoais</legend> 
            <!-- legenda para o fieldset, para acessibilidade -->
            <label for="name">Nome</label>
            <input type="text" name="name" required>
            <br>
            <label for="age">Idade</label>
            <input type="number" name="age" required min="12" max="100">
            <br>
            <label for ="birthday">Data de Nascimento</label>
            <input type="date" name="birthday">
            <br>
            <label for ="email">Email</label>
            <input type="email" name="email" required>
            <br>
            <label for="telephone">Telefone</label>
            <input type="tel" name="telephone" pattern="[0-9]{11}" placeholder="DDD + número">
            <br>
            <label for="userImage">Upload de foto</label>
            <input type="file" name="userImage" accept="image/*">
            <br>
            <button type="submit">Enviar</button>
            </fieldset>
        </form>

    </section>  


    
</body>
</html>
